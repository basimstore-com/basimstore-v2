<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Basim Store Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-layout">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon">👑</div>
            <div class="sidebar-brand-text">C$K4</div>
            <div class="sidebar-brand-sub">Admin Panel</div>
        </div>
        <ul class="sidebar-menu">
            <a href="dashboard.html" class="sidebar-item active">
                <span class="sidebar-icon">📊</span>
                <span>Dashboard</span>
            </a>
            <a href="products.html" class="sidebar-item">
                <span class="sidebar-icon">📦</span>
                <span>Products</span>
            </a>
            <a href="orders.html" class="sidebar-item">
                <span class="sidebar-icon">🛒</span>
                <span>Orders</span>
                <span class="sidebar-badge" id="pendingBadge" style="display:none">0</span>
            </a>
            <a href="settings.html" class="sidebar-item">
                <span class="sidebar-icon">⚙️</span>
                <span>Settings</span>
            </a>
            <div style="height:1px;background:rgba(200,151,58,.2);margin:12px 16px;"></div>
            <a href="../" class="sidebar-item" target="_blank">
                <span class="sidebar-icon">🌐</span>
                <span>View Website</span>
            </a>
            <a href="#" class="sidebar-item" onclick="logout();return false;">
                <span class="sidebar-icon">🚪</span>
                <span>Logout</span>
            </a>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
        <!-- TOPBAR -->
        <div class="admin-topbar">
            <div class="topbar-title">📊 Dashboard</div>
            <div class="topbar-actions">
                <button class="notif-btn" onclick="toggleNotif()">
                    🔔
                    <span class="notif-count" id="notifCount" style="display:none">0</span>
                </button>
                <button class="btn btn-secondary btn-sm" onclick="loadStats()">🔄 Refresh</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-value" id="statProducts">—</div>
                <div class="stat-label">Products</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🛒</div>
                <div class="stat-value" id="statOrders">—</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-value" id="statPending">—</div>
                <div class="stat-label">Pending Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-value" id="statRevenue">—</div>
                <div class="stat-label">Revenue</div>
            </div>
        </div>

        <!-- RECENT ORDERS -->
        <div class="content-card">
            <div class="card-header">
                <div class="card-title">🕒 Recent Orders</div>
                <a href="orders.html" class="btn btn-secondary btn-sm">View All →</a>
            </div>
            <div id="recentOrders">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>

        <!-- QUICK ACTIONS -->
        <div class="content-card">
            <div class="card-header">
                <div class="card-title">⚡ Quick Actions</div>
            </div>
            <div class="grid-3">
                <a href="products.html" class="btn btn-primary btn-block">
                    ➕ Add Product
                </a>
                <a href="orders.html" class="btn btn-secondary btn-block">
                    📋 Manage Orders
                </a>
                <a href="settings.html" class="btn btn-secondary btn-block">
                    ⚙️ Store Settings
                </a>
            </div>
        </div>
    </main>
</div>

<!-- NOTIFICATIONS DROPDOWN -->
<div class="notif-dropdown" id="notifDropdown" style="position:fixed;top:80px;right:24px;">
    <div style="padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
        <b>🔔 Notifications</b>
        <button class="btn btn-sm btn-secondary" onclick="markAllRead()">Mark all read</button>
    </div>
    <div id="notifList">
        <div style="padding:30px;text-align:center;color:var(--text-muted);font-size:13px;">No notifications</div>
    </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
const API = window.location.origin + '/api';
const token = localStorage.getItem('admin_token');

// Check auth
if (!token) {
    window.location.href = 'login.html';
}

const headers = {
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json'
};

// ═══ TOAST ═══
function showToast(msg, type = '') {
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    document.getElementById('toast').appendChild(t);
    setTimeout(() => {
        t.style.opacity = '0';
        setTimeout(() => t.remove(), 300);
    }, 2500);
}

// ═══ LOGOUT ═══
function logout() {
    if (confirm('Logout?')) {
        localStorage.removeItem('admin_token');
        localStorage.removeItem('admin_user');
        window.location.href = 'login.html';
    }
}

// ═══ LOAD STATS ═══
async function loadStats() {
    try {
        const r = await fetch(`${API}/admin/stats`, { headers });
        
        if (r.status === 401) {
            localStorage.removeItem('admin_token');
            window.location.href = 'login.html';
            return;
        }
        
        const s = await r.json();
        
        document.getElementById('statProducts').textContent = s.products || 0;
        document.getElementById('statOrders').textContent = s.orders || 0;
        document.getElementById('statPending').textContent = s.pendingOrders || 0;
        document.getElementById('statRevenue').textContent = '₨' + (s.revenue || 0).toLocaleString();
        
        // Pending badge in sidebar
        const pb = document.getElementById('pendingBadge');
        if (s.pendingOrders > 0) {
            pb.textContent = s.pendingOrders;
            pb.style.display = 'inline-block';
        } else {
            pb.style.display = 'none';
        }
        
        // Notification count
        const nc = document.getElementById('notifCount');
        if (s.unreadNotifications > 0) {
            nc.textContent = s.unreadNotifications;
            nc.style.display = 'flex';
        } else {
            nc.style.display = 'none';
        }
    } catch (err) {
        console.error(err);
        showToast('Failed to load stats', 'error');
    }
}

// ═══ LOAD RECENT ORDERS ═══
async function loadRecentOrders() {
    try {
        const r = await fetch(`${API}/orders?limit=5`, { headers });
        const data = await r.json();
        
        const el = document.getElementById('recentOrders');
        
        if (!data.orders || !data.orders.length) {
            el.innerHTML = `<div class="empty-state">
                <div class="empty-icon">📦</div>
                <div class="empty-title">No orders yet</div>
                <p>Orders yahan dikhenge jab users order karenge</p>
            </div>`;
            return;
        }
        
        el.innerHTML = `<table class="data-table">
            <thead>
                <tr>
                    <th>Order #</th>
                    <th>Customer</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                ${data.orders.map(o => `
                    <tr>
                        <td><b>${o.order_no || '—'}</b></td>
                        <td>${o.customer_name || '—'}<br><small style="color:var(--text-muted)">${o.customer_phone || ''}</small></td>
                        <td><b>₨${(o.total || 0).toLocaleString()}</b></td>
                        <td><span class="badge badge-${(o.status || 'pending').toLowerCase()}">${o.status || 'Pending'}</span></td>
                        <td>${new Date(o.created_at).toLocaleDateString('en-PK', {day:'numeric', month:'short'})}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>`;
    } catch (err) {
        console.error(err);
    }
}

// ═══ NOTIFICATIONS ═══
let notifOpen = false;

function toggleNotif() {
    notifOpen = !notifOpen;
    document.getElementById('notifDropdown').classList.toggle('open', notifOpen);
    if (notifOpen) loadNotifications();
}

async function loadNotifications() {
    try {
        const r = await fetch(`${API}/notifications`, { headers });
        const data = await r.json();
        
        const list = document.getElementById('notifList');
        
        if (!data.notifications || !data.notifications.length) {
            list.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text-muted);font-size:13px;">No notifications</div>`;
            return;
        }
        
        list.innerHTML = data.notifications.slice(0, 20).map(n => `
            <div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="markRead(${n.id})">
                <div class="notif-item-title">${n.title || ''}</div>
                <div class="notif-item-msg">${n.message || ''}</div>
                <div class="notif-item-time">${new Date(n.created_at).toLocaleString('en-PK')}</div>
            </div>
        `).join('');
    } catch (err) {
        console.error(err);
    }
}

async function markRead(id) {
    try {
        await fetch(`${API}/notifications/${id}/read`, { method: 'PUT', headers });
        loadNotifications();
        loadStats();
    } catch (err) {}
}

async function markAllRead() {
    try {
        await fetch(`${API}/notifications/read-all`, { method: 'PUT', headers });
        loadNotifications();
        loadStats();
        showToast('All marked as read', 'success');
    } catch (err) {}
}

// ═══ REAL-TIME NOTIFICATIONS ═══
if (typeof io !== 'undefined') {
    // Socket.io loaded from CDN if needed
}

// Load Socket.io dynamically
const script = document.createElement('script');
script.src = '/socket.io/socket.io.js';
script.onload = () => {
    const socket = io({ auth: { token: localStorage.getItem('admin_token') } });
    
    socket.on('notification', (n) => {
        showToast(`🔔 ${n.title}: ${n.message}`, 'info');
        loadStats();
        if (notifOpen) loadNotifications();
    });
    
    socket.on('new_order', (n) => {
        showToast(`🛍️ New order from ${n.data?.customerName || 'customer'}!`, 'success');
        loadRecentOrders();
        loadStats();
    });
};
document.head.appendChild(script);

// ═══ INIT ═══
loadStats();
loadRecentOrders();

// Refresh every 30 seconds
setInterval(() => {
    loadStats();
    loadRecentOrders();
}, 30000);

// Close notification dropdown on click outside
document.addEventListener('click', (e) => {
    if (notifOpen && !e.target.closest('.notif-btn') && !e.target.closest('.notif-dropdown')) {
        notifOpen = false;
        document.getElementById('notifDropdown').classList.remove('open');
    }
});
</script>

</body>
</html>
