<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Basim Store Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon">👑</div>
            <div class="sidebar-brand-text">C$K4</div>
            <div class="sidebar-brand-sub">Admin Panel</div>
        </div>
        <ul class="sidebar-menu">
            <a href="dashboard.html" class="sidebar-item"><span class="sidebar-icon">📊</span><span>Dashboard</span></a>
            <a href="products.html" class="sidebar-item"><span class="sidebar-icon">📦</span><span>Products</span></a>
            <a href="orders.html" class="sidebar-item active"><span class="sidebar-icon">🛒</span><span>Orders</span></a>
            <a href="settings.html" class="sidebar-item"><span class="sidebar-icon">⚙️</span><span>Settings</span></a>
            <div style="height:1px;background:rgba(200,151,58,.2);margin:12px 16px;"></div>
            <a href="../" class="sidebar-item" target="_blank"><span class="sidebar-icon">🌐</span><span>View Website</span></a>
            <a href="#" class="sidebar-item" onclick="logout();return false;"><span class="sidebar-icon">🚪</span><span>Logout</span></a>
        </ul>
    </aside>

    <main class="admin-main">
        <div class="admin-topbar">
            <div class="topbar-title">🛒 Orders</div>
            <div class="topbar-actions">
                <select class="form-select" style="max-width:150px;" id="statusFilter" onchange="loadOrders()">
                    <option value="all">All Orders</option>
                    <option value="Pending">Pending</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Shipped">Shipped</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
                <button class="btn btn-secondary btn-sm" onclick="loadOrders()">🔄 Refresh</button>
            </div>
        </div>

        <div class="content-card">
            <div class="card-header">
                <div class="card-title">All Orders (<span id="orderCount">0</span>)</div>
            </div>
            <div id="ordersContainer">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </main>
</div>

<!-- ORDER DETAIL MODAL -->
<div class="modal-overlay" id="orderModal">
    <div class="modal-box" style="max-width:720px;">
        <div class="modal-head">
            <div class="modal-title">📋 Order Details</div>
            <button class="modal-close" onclick="closeOrderModal()">✕</button>
        </div>
        <div class="modal-body" id="orderDetail"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeOrderModal()">Close</button>
            <a id="whatsappBtn" class="btn btn-success" target="_blank">💬 WhatsApp Customer</a>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
const API = window.location.origin + '/api';
const token = localStorage.getItem('admin_token');
if (!token) window.location.href = 'login.html';

const headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
let allOrders = [];

function showToast(msg, type = '') {
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    document.getElementById('toast').appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
}

function logout() {
    if (confirm('Logout?')) {
        localStorage.removeItem('admin_token');
        window.location.href = 'login.html';
    }
}

async function loadOrders() {
    const status = document.getElementById('statusFilter').value;
    try {
        const r = await fetch(`${API}/orders?status=${status}`, { headers });
        const d = await r.json();
        allOrders = d.orders || [];
        renderOrders(allOrders);
        document.getElementById('orderCount').textContent = allOrders.length;
    } catch (err) {
        console.error(err);
        showToast('Failed to load', 'error');
    }
}

function renderOrders(orders) {
    const el = document.getElementById('ordersContainer');
    
    if (!orders.length) {
        el.innerHTML = `<div class="empty-state">
            <div class="empty-icon">📦</div>
            <div class="empty-title">No orders yet</div>
            <p>Orders yahan dikhenge</p>
        </div>`;
        return;
    }

    el.innerHTML = `<table class="data-table">
        <thead>
            <tr>
                <th>Order #</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            ${orders.map(o => `
                <tr>
                    <td><b>${o.order_no || '#' + o.id}</b></td>
                    <td>${o.customer_name}<br><small style="color:var(--text-muted)">${o.customer_phone}</small></td>
                    <td><b>₨${(o.total || 0).toLocaleString()}</b></td>
                    <td>${o.payment_method || 'COD'}</td>
                    <td><span class="badge badge-${(o.status || 'pending').toLowerCase()}">${o.status}</span></td>
                    <td>${new Date(o.created_at).toLocaleDateString('en-PK')}</td>
                    <td>
                        <button class="btn btn-sm btn-secondary" onclick="viewOrder(${o.id})">👁️</button>
                        <select class="form-select" style="width:auto;display:inline-block;padding:5px 8px;font-size:11px;" onchange="updateStatus(${o.id}, this.value)">
                            <option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option>
                            <option value="Confirmed" ${o.status==='Confirmed'?'selected':''}>Confirmed</option>
                            <option value="Shipped" ${o.status==='Shipped'?'selected':''}>Shipped</option>
                            <option value="Delivered" ${o.status==='Delivered'?'selected':''}>Delivered</option>
                            <option value="Cancelled" ${o.status==='Cancelled'?'selected':''}>Cancelled</option>
                        </select>
                    </td>
                </tr>
            `).join('')}
        </tbody>
    </table>`;
}

async function updateStatus(id, status) {
    try {
        await fetch(`${API}/orders/${id}/status`, {
            method: 'PUT', headers, body: JSON.stringify({ status })
        });
        showToast('Status updated ✅', 'success');
        loadOrders();
    } catch (err) {
        showToast('Failed', 'error');
    }
}

async function viewOrder(id) {
    const order = allOrders.find(o => o.id === id);
    if (!order) return;

    const items = order.items || [];
    const itemsHTML = items.map(i => `
        <tr>
            <td>${i.name}</td>
            <td>×${i.qty}</td>
            <td>₨${(i.price * i.qty).toLocaleString()}</td>
        </tr>
    `).join('');

    document.getElementById('orderDetail').innerHTML = `
        <div style="background:var(--bg);padding:14px;border-radius:10px;margin-bottom:16px;">
            <div style="font-size:18px;font-weight:700;margin-bottom:8px;">${order.order_no}</div>
            <div style="font-size:12px;color:var(--text-muted);">${new Date(order.created_at).toLocaleString('en-PK')}</div>
        </div>

        <div class="grid-2" style="margin-bottom:16px;">
            <div>
                <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px;">Customer</div>
                <div><b>${order.customer_name}</b></div>
                <div>📱 ${order.customer_phone}</div>
                ${order.customer_email ? `<div>✉️ ${order.customer_email}</div>` : ''}
            </div>
            <div>
                <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px;">Shipping</div>
                <div>${order.address}</div>
                <div>${order.tehsil}, ${order.city}</div>
                <div>${order.province}</div>
            </div>
        </div>

        <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;">Items</div>
        <table class="data-table" style="margin-bottom:16px;">
            <thead><tr><th>Product</th><th>Qty</th><th>Total</th></tr></thead>
            <tbody>${itemsHTML}</tbody>
        </table>

        <div style="background:var(--bg);padding:14px;border-radius:10px;">
            <div style="display:flex;justify-content:space-between;padding:4px 0;">
                <span>Subtotal</span><span>₨${(order.subtotal || 0).toLocaleString()}</span>
            </div>
            ${order.coupon_discount ? `<div style="display:flex;justify-content:space-between;padding:4px 0;color:var(--success);"><span>Coupon</span><span>-₨${order.coupon_discount.toLocaleString()}</span></div>` : ''}
            ${order.gift_fee ? `<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Gift Wrap</span><span>+₨${order.gift_fee.toLocaleString()}</span></div>` : ''}
            <div style="display:flex;justify-content:space-between;padding:4px 0;">
                <span>Shipping</span><span>₨${(order.shipping || 0).toLocaleString()}</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:10px 0;border-top:2px solid var(--border);margin-top:8px;font-weight:700;font-size:16px;">
                <span>Total</span><span>₨${(order.total || 0).toLocaleString()}</span>
            </div>
        </div>

        <div style="margin-top:16px;font-size:13px;">
            <div><b>Payment:</b> ${order.payment_method}</div>
            <div><b>Status:</b> <span class="badge badge-${order.status.toLowerCase()}">${order.status}</span></div>
        </div>
    `;

    document.getElementById('whatsappBtn').href = `https://wa.me/${order.customer_phone.replace(/^0/, '92')}?text=${encodeURIComponent(`Hi ${order.customer_name}, aapka order ${order.order_no} ke baare mein baat karni hai.`)}`;
    document.getElementById('orderModal').classList.add('open');
}

function closeOrderModal() {
    document.getElementById('orderModal').classList.remove('open');
}

loadOrders();
setInterval(loadOrders, 15000);
</script>

</body>
</html>
